<style>
:root, [data-theme="light"] { --bg:#F4ECE2; --paper:#FBF7F1; --ink:#211A17; --muted:#6F625A; --accent:#B4532F; --accent-ink:#FFF8F1; --soft:#E7D6C3; --line:rgba(33,26,23,.14); --shadow:0 18px 40px -22px rgba(33,26,23,.45); }
[data-theme="dark"] { --bg:#17120F; --paper:#221B17; --ink:#F4ECE2; --muted:#B5A698; --accent:#E07B50; --accent-ink:#1A1310; --soft:#3A2D26; --line:rgba(244,236,226,.14); --shadow:0 18px 40px -22px rgba(0,0,0,.8); }
* { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; transition:background .35s, color .35s; -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.wrap { max-width:1240px; margin:0 auto; padding:0 32px; }
.script { font-family:'Instrument Serif', serif; font-style:italic; font-weight:400; }
.label { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }

/* barre du haut */
header.top { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
header.top .wrap { display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
.brand { font-size:12.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
.brand b { color:var(--accent); }
.toggles { display:flex; gap:8px; }
.seg { display:flex; border:1px solid var(--line); border-radius:99px; padding:3px; background:var(--paper); }
.seg button { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--muted); transition:.2s; }
.seg button.on { background:var(--ink); color:var(--bg); }
.seg svg { width:14px; height:14px; }

/* héro */
.hero { padding:64px 0 40px; display:grid; grid-template-columns:1.35fr .65fr; gap:40px; align-items:end; }
.hero h1 { font-family:'Archivo'; font-weight:900; letter-spacing:-.045em; line-height:.86; font-size:clamp(64px, 11vw, 168px); }
.hero h1 .script { display:block; color:var(--accent); font-size:.86em; letter-spacing:-.02em; margin-top:-.02em; }
.hero p.lead { margin-top:26px; max-width:560px; font-size:17px; line-height:1.6; color:var(--muted); }
.stats { display:flex; gap:34px; margin-top:30px; flex-wrap:wrap; }
.stats div b { display:block; font-family:'Archivo'; font-weight:900; font-size:44px; letter-spacing:-.04em; color:var(--accent); line-height:1; }
.stats div span { font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.arch { justify-self:end; width:100%; max-width:330px; aspect-ratio:3/4; border-radius:999px 999px 26px 26px; overflow:hidden; background:var(--soft); box-shadow:var(--shadow); position:relative; }
.arch img { width:100%; height:100%; object-fit:cover; object-position:50% 25%; }
.arch .badge { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); white-space:nowrap; background:var(--accent); color:var(--accent-ink); padding:8px 16px; border-radius:99px; font-size:12.5px; font-weight:700; display:flex; gap:8px; align-items:center; }
.arch .badge i { width:8px; height:8px; border-radius:50%; background:currentColor; animation:pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity:.25; } }

/* filtres */
.filters { position:sticky; top:64px; z-index:15; background:var(--bg); padding:16px 0; border-bottom:1px solid var(--line); transition:background .35s; }
.filters .wrap { display:flex; gap:8px; flex-wrap:wrap; }
.chip { padding:9px 16px; border-radius:99px; border:1px solid var(--line); font-size:13.5px; font-weight:600; transition:.2s; background:var(--paper); }
.chip.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.chip:hover:not(.on) { border-color:var(--ink); }

/* sections */
section.client { padding:56px 0 18px; }
.chead { display:grid; grid-template-columns:auto 1fr auto; gap:24px; align-items:end; margin-bottom:26px; }
.chead .num { font-family:'Archivo'; font-weight:900; font-size:92px; line-height:.8; letter-spacing:-.06em; color:var(--soft); transition:color .35s; }
.chead h2 { font-family:'Archivo'; font-weight:800; font-size:clamp(28px,3.4vw,44px); letter-spacing:-.03em; line-height:1; margin-top:6px; }
.chead p { margin-top:10px; color:var(--muted); font-size:15px; max-width:620px; line-height:1.5; }
.chead .count { font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; }
.reel { display:flex; gap:20px; overflow-x:auto; padding:6px 2px 26px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
.card { flex:none; scroll-snap-align:start; text-align:left; }
.card .frame { position:relative; overflow:hidden; border-radius:22px; background:#000; box-shadow:var(--shadow); transition:transform .35s cubic-bezier(.2,.8,.2,1); }
.card.v .frame { width:236px; aspect-ratio:9/16; }
.card.s .frame { width:300px; aspect-ratio:4/5; }
.card.h .frame { width:520px; aspect-ratio:16/9; }
.card:hover .frame { transform:translateY(-6px) rotate(-.6deg); }
.card img, .card video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.card video { opacity:0; transition:opacity .3s; }
.card.preview video { opacity:1; }
.card .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px; height:64px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,.35); transition:transform .25s, opacity .25s; }
.card:hover .play { transform:translate(-50%,-50%) scale(1.1); }
.card.preview .play { opacity:0; }
.card .play svg { width:22px; height:22px; margin-left:3px; }
.card .dur { position:absolute; right:12px; top:12px; background:rgba(0,0,0,.55); color:#fff; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:99px; backdrop-filter:blur(4px); }
.card .tag { position:absolute; left:12px; top:12px; background:var(--bg); color:var(--ink); font-size:11px; font-weight:700; padding:5px 10px; border-radius:99px; }
.card .cap { margin-top:12px; font-weight:600; font-size:14.5px; max-width:100%; }
.card.v .cap, .card.v .sub { width:236px; } .card.s .cap, .card.s .sub { width:300px; } .card.h .cap, .card.h .sub { width:520px; }
.card .sub { margin-top:4px; font-size:12.5px; color:var(--muted); line-height:1.4; }

/* contact */
.contact { margin:70px 0 0; padding:70px 0; border-top:1px solid var(--line); }
.contact .wrap { display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center; }
.contact h2 { font-family:'Archivo'; font-weight:900; font-size:clamp(48px,7vw,96px); letter-spacing:-.045em; line-height:.9; }
.contact h2 .script { display:block; color:var(--accent); font-weight:400; letter-spacing:-.02em; }
.cbtns { display:flex; flex-direction:column; gap:14px; }
.cbtn { display:flex; align-items:center; gap:16px; padding:18px 22px; border-radius:20px; background:var(--paper); border:1px solid var(--line); transition:.2s; }
.cbtn:hover { transform:translateX(4px); border-color:var(--ink); }
.cbtn.main { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.cbtn .ic { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--accent); flex:none; }
.cbtn.main .ic { background:var(--accent-ink); }
.cbtn .ic svg { width:24px; height:24px; }
.cbtn small { display:block; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.75; }
.cbtn b { font-family:'Archivo'; font-size:21px; font-weight:700; }
footer { padding:26px 0 40px; font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
footer .wrap { display:flex; justify-content:space-between; gap:20px; align-items:center; }
footer .sig { font-family:'Instrument Serif'; font-style:italic; font-size:22px; letter-spacing:0; text-transform:none; color:var(--ink); }

/* lecteur plein écran */
.lb { position:fixed; inset:0; z-index:50; background:rgba(14,10,8,.92); display:none; align-items:center; justify-content:center; padding:24px; }
.lb.open { display:flex; }
.lb .stage { display:flex; gap:28px; align-items:center; max-width:1200px; width:100%; justify-content:center; }
.lb video { max-height:86vh; max-width:min(100%, 1000px); border-radius:18px; background:#000; box-shadow:0 30px 80px rgba(0,0,0,.6); }
.lb .info { color:#F4ECE2; max-width:300px; }
.lb .info .label { color:#E07B50; }
.lb .info h3 { font-family:'Archivo'; font-weight:800; font-size:28px; letter-spacing:-.02em; margin:8px 0 10px; line-height:1.05; }
.lb .info p { color:#CDBFB3; font-size:14.5px; line-height:1.55; }
.lb .info .pos { margin-top:18px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#B5A698; }
.lb .x, .lb .nav { position:absolute; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.1); color:#fff; display:flex; align-items:center; justify-content:center; transition:.2s; }
.lb .x:hover, .lb .nav:hover { background:#E07B50; }
.lb .x { top:20px; right:20px; font-size:26px; }
.lb .prev { left:20px; top:50%; transform:translateY(-50%); } .lb .next { right:20px; top:50%; transform:translateY(-50%); }
.lb .nav svg { width:22px; height:22px; }

@media (max-width: 860px) {
  .wrap { padding:0 18px; }
  .hero { grid-template-columns:1fr; padding-top:36px; }
  .arch { justify-self:start; max-width:230px; }
  .brand span { display:none; }
  .chead { grid-template-columns:1fr; gap:8px; } .chead .num { font-size:60px; }
  .card.v .frame, .card.v .cap, .card.v .sub { width:190px; }

  .card.h .frame, .card.h .cap, .card.h .sub { width:300px; }
  .contact .wrap { grid-template-columns:1fr; }
  .lb .stage { flex-direction:column; gap:14px; } .lb .info { max-width:none; text-align:center; } .lb .info p { display:none; }
  .lb .nav { top:auto; bottom:20px; transform:none; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

  document.getElementById("sections").innerHTML = CLIENTS.filter(c => filter==="all" || filter===c.id).map((c,ci) => `
    <section class="client" id="${c.id}"><div class="wrap">
      <div class="chead"><div class="num">${String(CLIENTS.indexOf(c)+1).padStart(2,"0")}</div>
        <div><div class="label">${c.role[lang]}</div><h2>${c.name}</h2><p>${c.text[lang]}</p></div>
        <div class="count">${c.videos.length} ${c.videos.length>1?T.videos:T.video}</div></div>
      <div class="reel">${c.videos.map(v => `
        <button class="card ${v.f}" data-v="${v.id}" id="v-${v.id}">
          <div class="frame"><img src="posters/${v.id}.jpg" alt="" loading="lazy"><video muted playsinline loop preload="none" data-src="videos/${v.id}.mp4"></video>
            <span class="tag">${v.tag[lang]}</span><span class="dur" data-dur="${v.id}"></span><span class="play">${playIcon}</span></div>
          <div class="cap">${v.t[lang]}</div><div class="sub">${v.d[lang]}</div>
        </button>`).join("")}</div>
    </div></section>`).join("");
  bindCards();
}
function setTheme(t){ document.documentElement.dataset.theme=t; localStorage.setItem("hn-theme",t);
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.classList.toggle("on", b.dataset.themeBtn===t)); }

function bindCards(){
  document.querySelectorAll(".card").forEach(card => {
    const vid = card.querySelector("video");
    // aperçu muet au survol (ordinateur uniquement)
    card.addEventListener("mouseenter", () => { if (!matchMedia("(hover:hover)").matches) return;
      if (!vid.src) vid.src = vid.dataset.src; vid.currentTime = 0; vid.play().then(()=>card.classList.add("preview")).catch(()=>{}); });
    card.addEventListener("mouseleave", () => { vid.pause(); card.classList.remove("preview"); });
    card.addEventListener("click", () => openLB(ALL.findIndex(v => v.id===card.dataset.v)));
  });
  // durées
  ALL.forEach(v => { const el = document.querySelector(`[data-dur="${v.id}"]`); if (!el) return;
    const m = document.createElement("video"); m.preload="metadata"; m.src=`videos/${v.id}.mp4`;
    m.addEventListener("loadedmetadata", () => el.textContent = fmt(m.duration)); });
}

// lecteur
const lb = document.getElementById("lb"), lbv = document.getElementById("lbv");
let cur = -1;
function openLB(i){
  cur = (i + ALL.length) % ALL.length; const v = ALL[cur];
  document.querySelectorAll(".card video").forEach(x => x.pause());
  lbv.src = `videos/${v.id}.mp4`; lbv.poster = `posters/${v.id}.jpg`;
  document.getElementById("lbc").textContent = v.client.name;
  document.getElementById("lbt").textContent = v.t[lang];
  document.getElementById("lbd").textContent = v.d[lang];
  document.getElementById("lbn").textContent = `${cur+1} / ${ALL.length}`;
  lb.classList.add("open"); document.body.style.overflow="hidden";
  history.replaceState(null, "", "#" + v.id);
  lbv.play().catch(() => {});
}
function closeLB(){ lb.classList.remove("open"); lbv.pause(); lbv.removeAttribute("src"); lbv.load(); document.body.style.overflow="";
  history.replaceState(null, "", location.pathname + location.search); }
document.getElementById("lbx").onclick = closeLB;
document.getElementById("lbp").onclick = () => openLB(cur-1);
document.getElementById("lbn2").onclick = () => openLB(cur+1);
lb.addEventListener("click", e => { if (e.target===lb) closeLB(); });
document.addEventListener("keydown", e => { if (!lb.classList.contains("open")) return;
  if (e.key==="Escape") closeLB(); if (e.key==="ArrowRight") openLB(cur+1); if (e.key==="ArrowLeft") openLB(cur-1); });
lbv.addEventListener("ended", () => openLB(cur+1));

document.addEventListener("click", e => {
  const l = e.target.closest("[data-lang]"); if (l) { lang=l.dataset.lang; localStorage.setItem("hn-lang",lang); render(); }
  const t = e.target.closest("[data-theme-btn]"); if (t) setTheme(t.dataset.themeBtn);
  const f = e.target.closest("[data-f]"); if (f) { filter=f.dataset.f; render(); }
});

// paramètres d'URL : ?lang=en&theme=dark#pacheram-reel1
const q = new URLSearchParams(location.search);
if (q.get("lang")) lang = q.get("lang")==="en" ? "en" : "fr";
setTheme(q.get("theme") || localStorage.getItem("hn-theme") || "light");
render();
const h = location.hash.slice(1);
if (h) { const i = ALL.findIndex(v => v.id===h);
  if (i >= 0) { document.getElementById("v-"+h)?.scrollIntoView({block:"center"}); openLB(i); }
  else document.getElementById(h)?.scrollIntoView(); }
</script>
</body>
</html>
